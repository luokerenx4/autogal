title: 辉夜潜行 / Kaguya Dive
# 《超时空辉夜姬！》(2026) 后日谈 · 那个空白的十年。
# 彩叶 18 岁，刚进大学。辉夜失去实体，碎片散在月读全网。
# 彩叶要 3 年内 (压缩自原作 10 年) 把灵魂数据捞回来 + 造一具能承载她的身体。
# 而月读上突然崛起的迷之主播 X，连八千代都看不透——你也得查清楚她是谁。
preset: training
modules:
  - ./modules/moon-dive.ts
switches:
  # Never set to true. Used as a "hide from hub menu" gate for scripts
  # launched only by triggers (evt_*). The training preset's hub builder
  # filters scripts by their `requires`; an unsatisfiable requires hides
  # them while still letting a trigger force-launch via currentScriptId.
  __trigger_only: false
training:
  # 3 年 × 4 季 = 12 个决策窗口。
  slotsPerDay: 4
  slotNames: [春, 夏, 秋, 冬]
  startDay: 1
  maxDay: 3
  decayPerDay: 0
  decayStatId: ""
  sleepActionId: end_year
  huntActionId: ""
  stats:
    # —— 学术与生活 ——
    - { id: engineering, name: 工学,   min: 0, max: 100, start: 5 }
    - { id: neuroscience, name: 神经科学, min: 0, max: 100, start: 0 }
    - { id: funds,       name: 资金,   min: 0, max: 100, start: 10 }
    - { id: stamina,     name: 心力,   min: 0, max: 12,  start: 7 }
    # —— 辉夜身体数据 4 类 ——
    - { id: data_neural, name: 神经映射, min: 0, max: 100, start: 0 }
    - { id: data_motor,  name: 运动模型, min: 0, max: 100, start: 0 }
    - { id: data_voice,  name: 声纹,    min: 0, max: 100, start: 0 }
    - { id: data_memory, name: 记忆碎片, min: 0, max: 100, start: 0 }
    # —— 关系与未知 ——
    - { id: bond,        name: 心连,    min: 0, max: 10,  start: 3 }
    - { id: x_intel,     name: X 线索,  min: 0, max: 100, start: 0 }
  endConditions:
    # 优先级从上到下。secret 最严，good 次之，neutral 再次，bad 兜底。
    # 与 12 slot 预算对齐的数学：
    #   - 剧情脚本 cost: 0（新加的 Script frontmatter 字段） → 不占 slot,
    #     玩家 12 slot 全用于 hub 决策
    #   - 每类 data 阈值 30。最优解：N 2×hospital(15) / M 2×blackonyx(14) /
    #     V 3×idol(10) / Mem 3×core(10) ≈ 10 dive 凑齐，剩 2 slot 给 eng/work/rest
    #   - GOOD 还要 eng ≥ 30、bond ≥ 5；core dive 顺带涨 bond，study 涨 eng
    - reason: 灵魂之约 · 辉夜以幽灵态留在月读，但她笑了
      when:
        all:
          - stat: { name: data_memory, min: 30 }
          - stat: { name: bond, min: 7 }
          - any:
              - stat: { name: data_neural, max: 29 }
              - stat: { name: data_motor,  max: 29 }
              - stat: { name: data_voice,  max: 29 }
      goto: end_secret
    - reason: 通电那一刻她睁开了眼 · GOOD
      when:
        all:
          - stat: { name: data_neural, min: 30 }
          - stat: { name: data_motor,  min: 30 }
          - stat: { name: data_voice,  min: 30 }
          - stat: { name: data_memory, min: 30 }
          - stat: { name: engineering, min: 30 }
          - stat: { name: bond,        min: 5 }
      goto: end_good
    - reason: 身体造出来了，但她不再是原来的她 · NEUTRAL
      when:
        all:
          - stat: { name: data_neural, min: 30 }
          - stat: { name: data_motor,  min: 30 }
          - stat: { name: data_voice,  min: 30 }
          - stat: { name: data_memory, min: 30 }
          - stat: { name: engineering, min: 30 }
      goto: end_neutral
    - reason: 三年到了 · 你看着空荡的实验室 · BAD
      when:
        # 时间到 = 第 3 年结束（end_year 动作把 day 推到 4 时触发）。
        # 注意：多字段 when 不会自动 AND，必须用 all: 显式组合。
        day: { min: 4 }
      goto: end_bad
