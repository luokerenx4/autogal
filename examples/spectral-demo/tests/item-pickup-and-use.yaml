name: 道具 pickup + 使用 → spectral 真的掉
description: |
  Verify the full item lifecycle through the C6 engine-level inventory
  schema: find_talisman gives 1 via `effects: { inventory: { talisman: 1 } }`,
  use_talisman (kind: useItem) consumes 1 via the baseline module's
  bundled useItem handler AND applies talisman.effects (spectral -10).
  After use, the inventory key is removed entirely (engine invariant:
  count <= 0 → key deleted).
state:
  baseline:
    completedScripts: [001_arrival, 002_first_youkai]
  training:
    day: 4
    slot: 0
    stats:
      spectral: 20
      sword_power: 3
      physical: 15
      mental: 5
      intellect: 3
    statMax:
      spectral: 100
      sword_power: 100
      physical: 20
      mental: 10
      intellect: 99
inputs:
  - { type: doActivity, id: "action:find_talisman" }
  # find_talisman is day-slot + cost 1, advances to slot 1
  - { type: doActivity, id: "action:use_talisman" }
assertions:
  # Spectral dropped by exactly 10 (item's effect)
  - kind: state
    path: training.stats.spectral
    eq: 10
  # Physical dropped 2 from find_talisman action's own effect
  - kind: state
    path: training.stats.physical
    eq: 13
  # Inventory key fully removed (use consumed the only talisman) —
  # engine invariant: count <= 0 → key deleted → object is empty
  - kind: state
    path: baseline.inventory
    eq: {}
