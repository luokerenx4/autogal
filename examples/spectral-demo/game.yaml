title: 妖刀さくら抄 / Spectral Suite
preset: ./preset/run.ts
modules:
  - ./modules/combat.ts
training:
  slotsPerDay: 3
  slotNames: [上午, 下午, 晚上]
  startDay: 1
  maxDay: 14
  decayPerDay: 2
  decayStatId: spectral
  sleepActionId: sleep
  huntActionId: hunt
  stats:
    - id: spectral
      name: 灵体化
      min: 0
      max: 100
      start: 5
      thresholds:
        - { min: 0,   label: 平稳,       color: green }
        - { min: 20,  label: 觉醒,       color: cyan }
        - { min: 50,  label: 危险,       color: yellow }
        - { min: 80,  label: 失控,       color: red }
        - { min: 100, label: 完全灵体化, color: red }
    - id: physical
      name: 体力
      min: 0
      max: 20
      start: 10
      thresholds:
        - { min: 0,  label: "", color: red }
        - { min: 6,  label: "", color: green }
    - id: mental
      name: 精神
      min: 0
      max: 10
      start: 5
      thresholds:
        - { min: 0, label: "", color: red }
        - { min: 3, label: "", color: green }
    - { id: intellect,   name: 学识,     min: 0, max: 99,  start: 0 }
  endConditions:
    - reason: 灵体化结局
      when: { stat: { name: spectral, min: 100 } }
      goto: end_consumed
    - reason: 与薄樱共同封印
      when:
        all:
          - scriptCompleted: 006_seal_ritual
          - affection: { character: alice, min: 4 }
      goto: end_alice_true
    - reason: 与碧河共同封印
      when:
        all:
          - scriptCompleted: 006_seal_ritual
          - affection: { character: bea, min: 4 }
      goto: end_bea_true
    - reason: 单身英雄结局
      when: { scriptCompleted: 006_seal_ritual }
      goto: end_seal_solo
    - reason: 时间耗尽
      when: { day: { min: 15 } }
      goto: end_timeup
