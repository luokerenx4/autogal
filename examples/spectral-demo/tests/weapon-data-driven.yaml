name: 武器作为资源 — basePower 自动初始化 + effects.weapons 增长
description: |
  C8 verification: weapons/yaodao.md declares basePower: 3.
  baseline init copies that into state.baseline.weapons.yaodao.power
  AND auto-equips yaodao (the only weapon).

  night_study action's effects now write to `weapons: { yaodao:
  { power: 2 } }` instead of the old `stats: { sword_power: 2 }`.
  This fixture seeds enough intellect to unlock night_study, runs
  it, and asserts weapon power grew from 3 → 5.
state:
  baseline:
    completedScripts: [001_arrival, 002_first_youkai]
  training:
    day: 3
    slot: 2
    stats:
      spectral: 5
      physical: 18
      mental: 5
      intellect: 3
    statMax:
      spectral: 100
      physical: 20
      mental: 10
      intellect: 99
inputs:
  - { type: doActivity, id: "action:night_study" }
assertions:
  # Engine auto-equipped the single declared weapon
  - kind: state
    path: baseline.equippedWeaponId
    eq: yaodao
  # basePower 3 + night_study's weapon delta of +2 = 5
  - kind: state
    path: baseline.weapons.yaodao.power
    eq: 5
  # night_study's other stat effects also applied (mental -2)
  - kind: state
    path: training.stats.mental
    eq: 3
