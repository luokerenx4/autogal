name: 战斗能在 step 模式下完整执行
description: |
  回归测试：之前 runCombat 多次 yield，但 step.ts 每次新建 engine 并在第一个
  yield 后 runner.return()，导致 combat 的 applyDelta 永远不执行。
  修复后 combat 应当原子结算 + 把 narration 推入 pendingNarrations 队列，
  引擎主循环每步排空一条。本 fixture 注入"必胜"数值，验证 hunt 之后
  sword_power 真的上去了、spectral-combat module 的 log 也写入了。
state:
  baseline:
    completedScripts: [001_arrival, 002_first_youkai]
    weapons:
      yaodao: { power: 50 }
  training:
    day: 2
    slot: 2
    stats:
      spectral: 0
      physical: 10
      mental: 5
      intellect: 0
    statMax:
      spectral: 100
      physical: 20
      mental: 10
      intellect: 99
inputs:
  - { type: doActivity, id: "action:hunt" }
  - { type: next }
  - { type: next }
  - { type: next }
assertions:
  - kind: state
    path: spectral-combat.log
    length: 1
  - kind: state
    path: baseline.weapons.yaodao.power
    gte: 52
  - kind: state
    path: runtime.pendingNarrations
    length: 0
