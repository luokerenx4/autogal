name: 开局状态：Day 1 上午，spectral=5，妖刀威力=3
description: |
  验证 training config 正确加载，初始 state 与 game.yaml 一致。
  sword_power 在 C8 之后从 training.stats 迁到 baseline.weapons.yaodao.power
  （basePower 在 weapons/yaodao.md 里声明为 3），equipped 自动选中
  唯一武器。
inputs: []
assertions:
  - kind: state
    path: training.day
    eq: 1
  - kind: state
    path: training.slot
    eq: 0
  - kind: state
    path: training.stats.spectral
    eq: 5
  - kind: state
    path: baseline.weapons.yaodao.power
    eq: 3
  - kind: state
    path: baseline.equippedWeaponId
    eq: yaodao
  - kind: state
    path: training.stats.physical
    eq: 10
  - kind: output
    type: hubMenu
    present: true
