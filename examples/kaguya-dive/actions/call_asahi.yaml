id: call_asahi
title: 给哥哥打电话
description: 让朝日转一笔钱。但每年只能开口几次。
category: social
slot: any
cost: 1
whenIn: [town]
effects:
  stats: { funds: 25, stamina: -1 }
  affection: { asahi: -1 }
narrations:
  - 朝日秒接电话。「打过来了。别说原因。」你听见他那边比赛后台的吵闹声。挂电话前他说："吃饱。"
  - 朝日没立刻接。两分钟后回拨过来。「直播前那十秒接不了。说。」你说要钱。他说「转你了。挂了。」干净。
  - 「妈昨天给我打电话，问你最近怎么样。」朝日没多说。你听懂了 —— 他帮你挡着。「需要多少？」你说一点点。他笑了一下：「这次说人话。」
  - 朝日今天声音哑。比赛刚打完。「你那边几点。」凌晨两点。「我五点。」他叹了一口气。「卡你账上了。」
