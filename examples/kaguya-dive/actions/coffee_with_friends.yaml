id: coffee_with_friends
title: 和芦花真实喝咖啡
description: 闺蜜三人聚。回心力，和芦花真实更熟络，但要应付"你最近怎么样"。
category: social
slot: any
cost: 1
whenIn: [town]
effects:
  stats: { stamina: 4 }
  affection: { ashihana: 1, mami: 1 }
narrations:
  - 三人在涩谷那家老咖啡店。芦花点的拿铁，真实点的奶茶，你点的美式。你撒谎说研究进展顺利。真实没问。芦花问了，被真实踩了一脚。
  - 你迟到了十分钟。芦花没说什么，把你那杯美式从她手心里挪到你面前，已经凉了。真实在切一块千层。
  - 芦花今天聊她直播间的弹幕。她说有粉丝问"芦花姐姐为什么最近发的视频里另一个手出现得更少了"。她笑了一下，没解释。
  - 真实带了一盒她自己做的甜点："失败的实验品。"芦花一口吃掉一块，说"这不叫失败"。你尝了一口。她真做得好。
  - 三人坐了一下午，没怎么说话。雨从窗外开始下，到下午六点也没停。芦花最后说"再坐一会儿。"
  - 芦花说她直播间下周有联动活动。她不点你的名，但提了一句"如果有人需要在背景里帮忙挂个小号头像"。你说好。她没说谢谢。
