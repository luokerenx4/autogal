name: combat 读 enemy 数据 — 名字、HP base、模板都从 enemies/*.md 来
description: |
  After C7, spectral-combat looks up the enemy via game.enemies +
  action.enemyId. The HP formula uses enemy.hp + day*1.5 (game-
  specific scaling), and the intro/victory/escape narrations come
  from enemy.narrations with template substitution.

  Seed: sw=30, spec=0, day=10 → enemyHp = floor(6 + 15) = 21,
  damage = 30 × 1 × variance = 24-36, always wins. Asserts the
  combat log entry contains the enemy id (proves combat actually
  resolved against the registered enemy, not a hardcoded one).
state:
  baseline:
    completedScripts: [001_arrival, 002_first_youkai]
    weapons:
      yaodao: { power: 30 }
  training:
    day: 10
    slot: 2
    stats:
      spectral: 0
      physical: 15
      mental: 5
      intellect: 4
    statMax:
      spectral: 100
      physical: 20
      mental: 10
      intellect: 99
inputs:
  - { type: doActivity, id: "action:hunt" }
  - { type: next }
  - { type: next }
  - { type: next }
assertions:
  - kind: state
    path: spectral-combat.log
    length: 1
  # The new log entry includes enemyId, proving we resolved against
  # the registered EnemyDef
  - kind: state
    path: spectral-combat.log.0.enemyId
    eq: youkai
  - kind: state
    path: spectral-combat.log.0.enemyHp
    eq: 21
  - kind: state
    path: spectral-combat.log.0.victory
    eq: true
