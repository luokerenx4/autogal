id: hell_gate
name: 地獄門
difficulty: 5
description: 砲響山の火口の奥、巌の裂け目の底。鬼の脈に染まった者だけが視える地。
entry_narration: 視界の縁が滲む。鬼の脈に染まった者にしか、この道は開かぬ。
spawn_zone_id: gate_mouth

zones:
  - id: gate_mouth
    name: 門口
    connections:
      - { dir: 奥, target: corridor }
    encounter_table:
      - { enemy: oni_warrior, weight: 100 }
    loot_table:
      - { item: cursed_blade_fragment, min: 1, max: 1, weight: 60 }
      - { item: oni_horn, min: 2, max: 3, weight: 40 }

  - id: corridor
    name: 業の廊
    connections:
      - { dir: 奥, target: mirror_pool }
      - { dir: 戻る, target: gate_mouth }
    encounter_table:
      - { enemy: kijin, weight: 60 }
      - { enemy: oni_warrior, weight: 40 }
    loot_table:
      - { item: cursed_blade_fragment, min: 1, max: 2, weight: 70 }
      - { item: oni_horn, min: 2, max: 4, weight: 30 }

  - id: mirror_pool
    name: 映し井戸
    is_extract: true
    connections:
      - { dir: 戻る, target: corridor }
    encounter_table:
      - { enemy: kijin, weight: 100 }
    loot_table:
      - { item: cursed_blade_fragment, min: 2, max: 3, weight: 100 }
