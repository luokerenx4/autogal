id: sumida_river
name: 隅田河
difficulty: 2
description: 江戸の東。汽水の濁り、葦の藪。月の出ない晩は鬼の通り道。
entry_narration: 葦の藪が、足首より高く伸びている。汽水の臭いが鼻を打つ。
spawn_zone_id: bridge_foot

zones:
  - id: bridge_foot
    name: 橋の袂
    connections:
      - { dir: 河岸沿い, target: reed_marsh }
      - { dir: 上流, target: ferry_landing }
    encounter_table:
      - { enemy: null, weight: 1 }
    loot_table:
      - { item: ryo, min: 8, max: 16, weight: 50 }
      - { item: null, min: 0, max: 0, weight: 50 }

  - id: reed_marsh
    name: 葦の藪
    connections:
      - { dir: 沼奥, target: drowned_shrine }
      - { dir: 戻る, target: bridge_foot }
    encounter_table:
      - { enemy: oni_lesser, weight: 60 }
      - { enemy: null, weight: 40 }
    loot_table:
      - { item: soul_shard, min: 1, max: 2, weight: 50 }
      - { item: ryo, min: 10, max: 20, weight: 30 }
      - { item: null, min: 0, max: 0, weight: 20 }

  - id: ferry_landing
    name: 渡し場
    is_extract: true
    connections:
      - { dir: 戻る, target: bridge_foot }
    encounter_table:
      - { enemy: null, weight: 1 }
    loot_table:
      - { item: ryo, min: 20, max: 35, weight: 70 }
      - { item: soul_shard, min: 1, max: 1, weight: 30 }

  - id: drowned_shrine
    name: 水没した社
    connections:
      - { dir: 奥, target: under_eaves }
      - { dir: 戻る, target: reed_marsh }
    encounter_table:
      - { enemy: oni_warrior, weight: 50 }
      - { enemy: oni_lesser, weight: 30 }
      - { enemy: null, weight: 20 }
    loot_table:
      - { item: oni_horn, min: 1, max: 1, weight: 40 }
      - { item: soul_shard, min: 2, max: 3, weight: 40 }
      - { item: ryo, min: 15, max: 25, weight: 20 }

  - id: under_eaves
    name: 軒下の闇
    is_extract: true
    connections:
      - { dir: 戻る, target: drowned_shrine }
    encounter_table:
      - { enemy: oni_warrior, weight: 80 }
      - { enemy: null, weight: 20 }
    loot_table:
      - { item: oni_horn, min: 1, max: 2, weight: 70 }
      - { item: cursed_blade_fragment, min: 1, max: 1, weight: 10 }
      - { item: soul_shard, min: 2, max: 3, weight: 20 }

  - id: drift_pier
    name: 流木の桟橋
    connections:
      - { dir: 戻る, target: drowned_shrine }
    encounter_table:
      - { enemy: oni_lesser, weight: 100 }
    loot_table:
      - { item: ryo, min: 25, max: 40, weight: 60 }
      - { item: soul_shard, min: 2, max: 3, weight: 40 }

character_spawns: []
