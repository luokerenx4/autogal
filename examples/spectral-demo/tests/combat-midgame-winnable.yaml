name: 中后期合理数值能打赢妖怪
description: |
  Balance regression: hunt 在合理数值下应当必胜。注入 spectral=0 来消除
  crit/fumble RNG（spectral × 0.7% crit + × 0.5% fumble 都为 0），
  sword_power=30 让最低 variance 也能 oneshot Day 10 妖怪（HP=21）。
  公式：damage = 30 * (1+0) * 0.8 = 24 ≥ 21，永远胜利。
  胜利奖励 sword_power += max(2, floor(21/4)) = 5，所以 sword_power 应达到 35。
state:
  baseline:
    completedScripts: [001_arrival, 002_first_youkai]
  training:
    day: 10
    slot: 2
    stats:
      spectral: 0
      sword_power: 30
      physical: 15
      mental: 5
      intellect: 4
    statMax:
      spectral: 100
      sword_power: 100
      physical: 20
      mental: 10
      intellect: 99
    pendingNarrations: []
inputs:
  - { type: doActivity, id: "action:hunt" }
  - { type: next }
  - { type: next }
  - { type: next }
assertions:
  - kind: state
    path: spectral-combat.log
    length: 1
  - kind: state
    path: training.stats.sword_power
    eq: 35
