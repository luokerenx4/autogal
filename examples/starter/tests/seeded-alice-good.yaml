name: 注入 alice 高好感 + 已选 alice route，应该解锁 005a good ending
description: |
  演示测试注入：跳过 001/002/003 的前置剧情，直接 seed 一个 mid-game state，
  验证 alice good ending 在该 state 下能到达。
state:
  baseline:
    characters:
      alice: { affection: 5, custom: {} }
      bea: { affection: 1, custom: {} }
    variables:
      route: alice
    completedScripts:
      - 001_meeting_alice
      - 002_meeting_bea
      - 003_invitation
      - 004a_alice_route
inputs:
  - { type: select, scriptId: "005a_alice_good" }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
assertions:
  - kind: state
    path: baseline.completedScripts
    includes: 005a_alice_good
  - kind: output
    type: gameEnd
    present: true
