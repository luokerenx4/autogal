name: 结局脚本在 step 模式下能完整推完
description: |
  Regression: checkEndConditions 用来在命中后重置 currentScriptId/beatIndex
  到 ending script 的开头，每次循环都跑一次。在 step 模式下（每次 step
  新建 engine），这导致 ending 脚本永远卡在第一个 beat 上、reach 不到
  gameEnd。修复后 ending 走普通 script-resume 路径。
state:
  baseline:
    completedScripts: [001_arrival, 002_first_youkai]
    weapons:
      yaodao: { power: 8 }
  training:
    day: 15
    slot: 0
    stats:
      spectral: 30
      physical: 10
      mental: 3
      intellect: 3
    statMax:
      spectral: 100
      physical: 20
      mental: 10
      intellect: 99
inputs:
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
  - { type: next }
assertions:
  - kind: state
    path: baseline.completedScripts
    includes: end_timeup
  - kind: output
    type: gameEnd
    present: true
